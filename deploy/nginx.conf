# Open Cal Hub — nginx 反向代理片段
# 放入 /etc/nginx/conf.d/ 或 sites-available 后 nginx -t && systemctl reload nginx
#
# CalDAV 方法透传要点：
#   1. nginx 默认透传任意 HTTP 方法（PROPFIND / REPORT / MKCOL / PUT / DELETE 等），
#      无需额外模块；切勿使用 limit_except 收窄方法集，否则 CalDAV 客户端会 405；
#   2. 保持 proxy_http_version 1.1（CalDAV 同步大量并发小请求，长连接更稳）；
#   3. /.well-known/caldav 由后端 301 到 /dav/，无需在 nginx 特判。

server {
    listen 80;
    server_name cal.example.com;    # 改为你的域名

    # CalDAV 整册同步与 ICS 导入的请求体可能较大
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # REPORT/PROPFIND 大响应与慢客户端
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

