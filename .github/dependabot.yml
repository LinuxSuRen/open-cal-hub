version: 2
updates:
  # 后端 Go 依赖（backend/go.mod）
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    groups:
      go-dependencies:
        patterns:
          - '*'
    commit-message:
      prefix: chore(deps)
      include: scope
    labels:
      - dependencies
      - backend

  # 前端 npm 依赖（frontend/package.json）
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    groups:
      npm-dependencies:
        patterns:
          - '*'
    # vue-tsc@3 尚未适配 TypeScript 7（Go 原生 tsc），TS 大版本升级会整组破坏
    # 前端构建（#12/#29 两度实证）。待 vue-tsc 适配后移除此规则。
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: chore(deps)
      include: scope
    labels:
      - dependencies
      - frontend

  # GitHub Actions（.github/workflows/*）
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    groups:
      actions-dependencies:
        patterns:
          - '*'
    commit-message:
      prefix: chore(deps)
      include: scope
    labels:
      - dependencies
      - ci

  # Dockerfile 基础镜像
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
      include: scope
    labels:
      - dependencies
      - docker
